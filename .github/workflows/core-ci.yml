name: Radar core C++ build and tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake pkg-config g++ libfftw3-dev libvolk2-dev libhdf5-dev libgtest-dev
      - name: Configure headless core
        run: cmake -S . -B build -DRADARSIM_BUILD_GUI=OFF -DRADARSIM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build core and test targets
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel 2
